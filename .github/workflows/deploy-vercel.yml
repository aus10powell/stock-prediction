name: Deploy to Vercel

# Manual / fallback deploy for remotes that have VERCEL_TOKEN.
# Day-to-day path: push to main — Vercel Git integration deploys automatically.

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_4Ob68Pc3jFRRZzXiTJp5orOz
  VERCEL_PROJECT_ID: prj_PZtqzfe6Ni9wtotu8fG5aYn1xriv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require VERCEL_TOKEN
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "Add repository secret VERCEL_TOKEN (https://vercel.com/account/tokens)."
          exit 1

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
